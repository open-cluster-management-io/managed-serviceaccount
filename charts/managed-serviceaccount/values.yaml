# Image of the managed service-account instances
image: quay.io/open-cluster-management/managed-serviceaccount
tag:
agentInstallAll: true

# Target managed cluster for rendering a ManagedClusterAddOn directly.
# Leave empty to rely on the ClusterManagementAddOn install strategy.
targetCluster: ""

# Number of replicas
replicas: 1

featureGates:
  ephemeralIdentity: false
  clusterProfile: false

agentImagePullSecret: ""

prometheus:
  enabled: false
  serviceMonitor:
    labels: {}

# Hub deploy mode: AddOnTemplate or Deployment
hubDeployMode: Deployment

# Name of the managed service-account addon template, only used when hubDeployMode is AddOnTemplate
addOnTemplateName: managed-serviceaccount

# Opt-in NetworkPolicies for the hub addon-manager and the managed-cluster
# addon-agent (via manager flag --enable-network-policies, or embedded in
# AddOnTemplate when hubDeployMode=AddOnTemplate). Default false so community
# installs are unchanged. Policies use port-based peers for portability across
# Kubernetes vendors. Metrics ingress (:38080) is opened only when prometheus
# is enabled.
networkPolicies:
  enabled: false
